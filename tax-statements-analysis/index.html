<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint so the wrong theme never flashes.
      (function () {
        var root = document.documentElement;
        var theme = "dark";
        try {
          theme = window.localStorage.getItem("tax-statements-theme") || "dark";
        } catch (error) {
          theme = "dark";
        }
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.classList.remove("light", "dark");
        root.classList.add(theme);
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2344cc00'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M&amp;M Tax Law Solutions</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
