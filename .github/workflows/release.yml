# بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ
#
# Release: build the Windows installer, sign it with the updater private key,
# and publish the GitHub Release that installed copies poll for updates.
#
# Only a tag push triggers this. The version in the tag must match `version` in
# tax-statements-analysis/src-tauri/tauri.conf.json: that is the version written
# into latest.json, and the number an installed copy compares itself against
# when deciding whether an update exists.
#
# The release is published at once (not left as a draft) because the updater
# endpoint is .../releases/latest/download/latest.json, and GitHub's "latest"
# skips both drafts and prereleases.

name: release

on:
  push:
    tags:
      - 'app-v*'

jobs:
  publish:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tax-statements-analysis/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tax-statements-analysis/src-tauri -> target'

      - name: install frontend dependencies
        working-directory: tax-statements-analysis
        run: npm ci

      # The pushed tag is the single source of truth for the version. Tauri reads
      # its version from tauri.conf.json (never from the tag), so it is stamped in
      # here before the build. Nothing version-related has to be edited by hand.
      - name: set version from the tag
        shell: pwsh
        working-directory: tax-statements-analysis/src-tauri
        run: |
          $tag = "${{ github.ref_name }}"
          $raw = $tag -replace '^app-v', ''
          if ($raw -notmatch '^\d+(\.\d+){0,2}(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$tag' does not carry a version (expected app-v2.5 or app-v2.5.1)."
          }
          # Tauri and latest.json require full semver, so a two-part tag such as
          # app-v2.5 becomes 2.5.0 instead of failing the build.
          $core, $suffix = $raw -split '-', 2
          $parts = @($core.Split('.') | Where-Object { $_ -ne '' })
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = $parts -join '.'
          if ($suffix) { $version = "$version-$suffix" }
          $path = Join-Path $PWD 'tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          Write-Host "Tag $tag -> version $version (was $($conf.version))"
          $conf.version = $version
          # Written without a byte-order mark: a BOM makes the JSON unreadable.
          $json = $conf | ConvertTo-Json -Depth 32
          [System.IO.File]::WriteAllText(
            $path, $json, (New-Object System.Text.UTF8Encoding($false))
          )

      # tauri-action finds the release for the pushed tag (creating it if this
      # is the first time) and uploads the installers, their .sig files, and
      # latest.json. updaterJsonPreferNsis points latest.json at the NSIS
      # setup.exe rather than the .msi, so that the `passive` installMode in
      # tauri.conf.json actually applies — the MSI path ignores it.
      #
      # Pinned to v0 on purpose. tauri-action v1.0.0 writes latest.json's
      # download urls as GitHub API asset urls
      # (api.github.com/repos/.../releases/assets/<id>): those are capped at 60
      # unauthenticated requests per hour per IP, so a client that exhausts the
      # quota gets a 403 instead of the installer and the update fails
      # silently. v0 writes github.com/.../releases/download/<tag>, which
      # redirects to the asset CDN and is not rate limited. Do not bump this
      # without rewriting the urls in latest.json after the upload.
      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tax-statements-analysis
          tagName: ${{ github.ref_name }}
          releaseName: 'Taxing App ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

# وَإِنَّ اللَّهَ لَهُوَ خَيْرُ الرَّازِقِينَ
